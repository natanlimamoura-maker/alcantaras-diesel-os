<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pátio Pro - Nuvem Supabase</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans pb-24">

    <!-- CABEÇALHO -->
    <header class="bg-blue-600 p-6 rounded-b-3xl shadow-lg flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-black italic tracking-wider text-white">PÁTIO PRO</h1>
            <p class="text-xs text-blue-200 font-medium">SUPABASE CLOUD</p>
        </div>
        <div class="bg-blue-800 px-4 py-2 rounded-full border border-blue-500 shadow-inner">
            <span id="contador-patio" class="text-sm font-bold text-white">0 NO PÁTIO</span>
        </div>
    </header>

    <!-- CONTAINER PRINCIPAL / ABAS -->
    <main class="max-w-md mx-auto p-4 mt-2">

        <!-- ABA 1: ENTRADA -->
        <section id="aba-entrada" class="space-y-4">
            <div class="bg-white text-slate-800 p-6 rounded-3xl shadow-xl space-y-4">
                <h2 class="text-blue-600 font-bold text-lg uppercase italic">Nova Entrada</h2>
                
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase">Placa</label>
                    <input type="text" id="input-placa" placeholder="EX: EJD5D22" class="w-full bg-slate-100 p-4 rounded-xl font-bold uppercase text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase">Modelo do Veículo</label>
                    <input type="text" id="input-modelo" placeholder="EX: IVECO DAILY" class="w-full bg-slate-100 p-4 rounded-xl font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase">Nome do Cliente</label>
                    <input type="text" id="input-cliente" placeholder="EX: TRANSPANTANAL" class="w-full bg-slate-100 p-4 rounded-xl font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="flex items-center gap-4 pt-2">
                    <label class="border-2 border-dashed border-blue-300 rounded-2xl p-4 flex flex-col items-center justify-center cursor-pointer hover:bg-blue-50 transition w-1/3">
                        <i class="fa-solid fa-camera text-2xl text-blue-500"></i>
                        <span class="text-[10px] font-bold text-blue-600 mt-1">FOTO</span>
                        <input type="file" id="input-foto" accept="image/*" class="hidden">
                    </label>
                    
                    <button onclick="salvarVeiculo()" class="w-2/3 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-lg transition uppercase tracking-wider">
                        Salvar
                    </button>
                </div>
                <div id="preview-foto-nome" class="text-xs text-slate-400 italic">Nenhuma foto selecionada</div>
            </div>
        </section>

        <!-- ABA 2: PÁTIO -->
        <section id="aba-patio" class="hidden space-y-4">
            <h2 class="text-lg font-bold text-slate-300 px-2">Veículos no Pátio</h2>
            <div id="lista-patio" class="space-y-4">
                <!-- Os cards entram dinamicamente via JS -->
            </div>
        </section>

        <!-- ABA 3: HISTÓRICO -->
        <section id="aba-historico" class="hidden space-y-4">
            <h2 class="text-lg font-bold text-slate-300 px-2">Histórico de Saídas</h2>
            <div id="lista-historico" class="space-y-3">
                <!-- Histórico dinâmico -->
            </div>
        </section>

    </main>

    <!-- MENU INFERIOR FIXO -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-800 border-t border-slate-700 flex justify-around py-3 shadow-2xl">
        <button onclick="mudarAba('entrada')" id="nav-entrada" class="flex flex-col items-center text-blue-400">
            <i class="fa-solid fa-plus text-lg"></i>
            <span class="text-[10px] font-bold mt-1">ENTRADA</span>
        </button>
        <button onclick="mudarAba('patio')" id="nav-patio" class="flex flex-col items-center text-slate-400">
            <i class="fa-solid fa-car text-lg"></i>
            <span class="text-[10px] font-bold mt-1">PÁTIO</span>
        </button>
        <button onclick="mudarAba('historico')" id="nav-historico" class="flex flex-col items-center text-slate-400">
            <i class="fa-solid fa-clipboard-list text-lg"></i>
            <span class="text-[10px] font-bold mt-1">HISTÓRICO</span>
        </button>
    </nav>

    <!-- SCRIPT DE CONEXÃO E LÓGICA -->
    <script>
        // CONFIGURAÇÃO SUPABASE COM AS SUAS CREDENCIAIS
        const SUPABASE_URL = 'https://ywybppfkyekqlrndwhdn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_R08_JT0lLER2lnRE-v4xSw_4Dgl8BDU';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let arquivoFoto = null;

        document.getElementById('input-foto').addEventListener('change', (e) => {
            arquivoFoto = e.target.files[0];
            if(arquivoFoto) {
                document.getElementById('preview-foto-nome').innerText = "Foto selecionada: " + arquivoFoto.name;
            }
        });

        function mudarAba(aba) {
            document.getElementById('aba-entrada').classList.add('hidden');
            document.getElementById('aba-patio').classList.add('hidden');
            document.getElementById('aba-historico').classList.add('hidden');

            document.getElementById('nav-entrada').className = "flex flex-col items-center text-slate-400";
            document.getElementById('nav-patio').className = "flex flex-col items-center text-slate-400";
            document.getElementById('nav-historico').className = "flex flex-col items-center text-slate-400";

            document.getElementById(`aba-${aba}`).classList.remove('hidden');
            document.getElementById(`nav-${aba}`).className = "flex flex-col items-center text-blue-400";

            if(aba === 'patio') carregarPatio();
            if(aba === 'historico') carregarHistorico();
        }

        async function salvarVeiculo() {
            const placa = document.getElementById('input-placa').value.toUpperCase();
            const modelo = document.getElementById('input-modelo').value.toUpperCase();
            const cliente = document.getElementById('input-cliente').value.toUpperCase();

            if(!placa || !modelo || !cliente) {
                alert('Preencha todos os campos!');
                return;
            }

            let fotoUrl = '';

            // Upload da foto para o Supabase Storage, se houver
            if(arquivoFoto) {
                const nomeArquivo = `${Date.now()}_${arquivoFoto.name}`;
                const { data: uploadData, error: uploadError } = await supabaseClient.storage
                    .from('fotos-veiculos')
                    .upload(nomeArquivo, arquivoFoto);

                if(uploadError) {
                    alert('Erro ao enviar foto: ' + uploadError.message);
                    return;
                }

                const { data: publicURL } = supabaseClient.storage
                    .from('fotos-veiculos')
                    .getPublicUrl(nomeArquivo);
                
                fotoUrl = publicURL.publicUrl;
            }

            // Inserir registro na tabela
            const { error } = await supabaseClient
                .from('patio_veiculos')
                .insert([{ placa, modelo, cliente, foto_url: fotoUrl, status: 'PATIO' }]);

            if(error) {
                alert('Erro ao salvar: ' + error.message);
            } else {
                alert('Veículo cadastrado com sucesso!');
                document.getElementById('input-placa').value = '';
                document.getElementById('input-modelo').value = '';
                document.getElementById('input-cliente').value = '';
                document.getElementById('input-foto').value = '';
                document.getElementById('preview-foto-nome').innerText = 'Nenhuma foto selecionada';
                arquivoFoto = null;
                mudarAba('patio');
            }
        }

        async function carregarPatio() {
            const { data, error } = await supabaseClient
                .from('patio_veiculos')
                .select('*')
                .eq('status', 'PATIO')
                .order('data_entrada', { ascending: false });

            if(error) {
                console.error(error);
                return;
            }

            document.getElementById('contador-patio').innerText = `${data.length} NO PÁTIO`;
            const container = document.getElementById('lista-patio');
            container.innerHTML = '';

            data.forEach(v => {
                container.innerHTML += `
                    <div class="bg-white text-slate-800 p-4 rounded-3xl shadow-xl flex items-center justify-between gap-3">
                        <img src="${v.foto_url || 'https://via.placeholder.com/150'}" class="w-16 h-16 rounded-2xl object-cover border">
                        <div class="flex-1">
                            <h3 class="font-black italic text-slate-900">${v.placa}</h3>
                            <p class="text-xs text-slate-500 font-bold">${v.modelo}</p>
                            <p class="text-[10px] text-blue-600 font-semibold">${v.cliente}</p>
                        </div>
                        <button onclick="darSaida('${v.id}')" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold px-4 py-3 rounded-2xl shadow transition">
                            SAÍDA
                        </button>
                    </div>
                `;
            });
        }

        async function darSaida(id) {
            if(!confirm('Confirmar a saída deste veículo do pátio?')) return;

            const { error } = await supabaseClient
                .from('patio_veiculos')
                .update({ status: 'SAIU', data_saida: new Date() })
                .eq('id', id);

            if(error) {
                alert('Erro ao registrar saída');
            } else {
                carregarPatio();
            }
        }

        async function carregarHistorico() {
            const { data, error } = await supabaseClient
                .from('patio_veiculos')
                .select('*')
                .eq('status', 'SAIU')
                .order('data_saida', { ascending: false })
                .limit(20);

            const container = document.getElementById('lista-historico');
            container.innerHTML = '';
               // Registrar Service Worker para permitir instalação
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker registrado com sucesso!'))
        .catch((err) => console.log('Erro ao registrar Service Worker:', err));
}
            if(data) {
                data.forEach(v => {
                    container.innerHTML += `
                        <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 flex justify-between items-center text-sm">
                            <div>
                                <span class="font-bold text-white">${v.placa}</span> - <span class="text-slate-400">${v.modelo}</span>
                                <div class="text-[10px] text-slate-500">Cliente: ${v.cliente}</div>
                            </div>
                            <span class="text-xs text-emerald-400 font-bold">LIBERADO</span>
                        </div>
                    `;
                });
            }
        }

        // Carregar contagem inicial ao abrir
        carregarPatio();
    </script>
</body>
</html>
