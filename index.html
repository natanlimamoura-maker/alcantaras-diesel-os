<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Pátio & Bancada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#dc2626">
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans pb-24 min-h-screen">

    <!-- CABEÇALHO -->
    <header class="bg-gradient-to-r from-red-700 to-red-600 p-4 rounded-b-3xl shadow-2xl flex justify-between items-center border-b border-red-500/30 sticky top-0 z-30">
        <div>
            <h1 class="text-lg font-black italic tracking-wider text-white flex items-center gap-2">
                <i class="fa-solid fa-truck-monster text-red-200"></i> CONTROLE DE PÁTIO
            </h1>
            <p class="text-[10px] text-red-100/80 uppercase font-semibold tracking-widest">Alcantara's Diesel</p>
        </div>
        <div class="flex flex-col items-end gap-1">
            <div class="bg-red-950/80 px-3 py-1 rounded-full border border-red-400/30 shadow-inner">
                <span id="contador-patio" class="text-[10px] font-black text-white tracking-wide">0 NO PÁTIO</span>
            </div>
            <div class="bg-slate-950/70 px-3 py-0.5 rounded-full border border-red-400/20">
                <span id="contador-bancada" class="text-[9px] font-bold text-red-200 tracking-wide">0 NA BANCADA</span>
            </div>
        </div>
    </header>

    <!-- CONTAINER PRINCIPAL -->
    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- ABA 1: ENTRADA DE VEÍCULO NO PÁTIO -->
        <section id="aba-entrada" class="space-y-4">
            <div class="bg-slate-900/90 backdrop-blur-md text-white p-6 rounded-3xl shadow-2xl space-y-5 border border-slate-800">
                <div class="border-b border-slate-800 pb-3 flex justify-between items-center">
                    <h2 class="text-red-500 font-black text-base uppercase tracking-wider flex items-center gap-2">
                        <i class="fa-solid fa-plus-circle"></i> Nova Entrada (Pátio)
                    </h2>
                    <span class="text-[10px] text-slate-400 font-medium">Dados do veículo</span>
                </div>
                
                <div class="space-y-4">
                    <div>
                        <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wide block mb-1">Placa do Veículo</label>
                        <input type="text" id="input-placa" placeholder="EX: ABC1D23" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-2xl font-black uppercase text-red-400 placeholder:text-slate-600 text-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition">
                    </div>

                    <div>
                        <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wide block mb-1">Modelo do Veículo</label>
                        <input type="text" id="input-modelo" placeholder="EX: IVECO DAILY 55C17" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-2xl font-semibold uppercase text-white placeholder:text-slate-600 text-sm focus:outline-none focus:ring-2 focus:ring-red-500 transition">
                    </div>

                    <div>
                        <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wide block mb-1">Cliente</label>
                        <input type="text" id="input-cliente" placeholder="EX: ANTHONY LOGÍSTICA" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-2xl font-semibold uppercase text-white placeholder:text-slate-600 text-sm focus:outline-none focus:ring-2 focus:ring-red-500 transition">
                    </div>
                </div>

                <div class="pt-2 border-t border-slate-800">
                    <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wide block mb-2">Foto do Veículo</label>
                    <div class="grid grid-cols-2 gap-3 mb-2">
                        <label class="border border-slate-700 bg-slate-950/60 rounded-2xl p-3 flex items-center justify-center gap-2 cursor-pointer hover:bg-slate-800 hover:border-red-500 transition active:scale-95">
                            <i class="fa-solid fa-camera text-red-500 text-base"></i>
                            <span class="text-xs font-bold text-slate-200">Tirar Foto</span>
                            <input type="file" id="input-foto-camera" accept="image/*" capture="environment" class="hidden">
                        </label>
                        <label class="border border-slate-700 bg-slate-950/60 rounded-2xl p-3 flex items-center justify-center gap-2 cursor-pointer hover:bg-slate-800 hover:border-red-500 transition active:scale-95">
                            <i class="fa-solid fa-images text-red-500 text-base"></i>
                            <span class="text-xs font-bold text-slate-200">Galeria</span>
                            <input type="file" id="input-foto-galeria" accept="image/*" class="hidden">
                        </label>
                    </div>
                    <div id="preview-foto-nome" class="text-[11px] text-slate-400 italic text-center min-h-[16px]">Nenhuma foto selecionada</div>
                </div>

                <button id="btn-salvar" onclick="salvarVeiculo()" class="w-full bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 text-white font-black py-4 rounded-2xl shadow-xl transition active:scale-95 uppercase tracking-wider flex items-center justify-center gap-2 text-sm mt-4">
                    <i class="fa-solid fa-check"></i> Registrar Entrada
                </button>
            </div>
        </section>

        <!-- ABA 2: PÁTIO -->
        <section id="aba-patio" class="hidden space-y-3">
            <div class="flex justify-between items-center px-1">
                <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider">Veículos no Pátio</h2>
                <span class="text-[10px] text-slate-500 italic">Toque no card para ver detalhes</span>
            </div>
            
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-500">
                    <i class="fa-solid fa-magnifying-glass text-xs"></i>
                </span>
                <input type="text" id="busca-patio" oninput="filtrarPatio()" placeholder="PESQUISAR POR PLACA OU CLIENTE..." class="w-full bg-slate-900 border border-slate-800 text-xs font-bold uppercase text-white pl-10 pr-4 py-3 rounded-2xl focus:outline-none focus:ring-2 focus:ring-red-500 placeholder:text-slate-600 transition">
            </div>

            <div id="lista-patio" class="space-y-3"></div>
        </section>

        <!-- ABA 3: HISTÓRICO DO PÁTIO -->
        <section id="aba-historico" class="hidden space-y-3">
            <div class="flex justify-between items-center px-1">
                <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider">Histórico de Saídas (Pátio)</h2>
                <span class="text-[10px] text-slate-500 italic">Toque para ver serviço/foto</span>
            </div>

            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-500">
