<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pátio Pro - Nuvem Supabase</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
</head>
<body class="bg-slate-900 text-slate-100 font-sans pb-24">

    <!-- CABEÇALHO -->
    <header class="bg-blue-600 p-6 rounded-b-3xl shadow-lg flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-black italic tracking-wider text-white">PÁTIO PRO</h1>
            <p class="text-xs text-blue-200 font-medium">SUPABASE CLOUD</p>
        </div>
        <div class="bg-blue-800 px-4 py-2 rounded-full border border-blue-500 shadow-inner">
            <span id="contador-patio" class="text-sm font-bold text-white">0 NO PÁTIO</span>
        </div>
    </header>

    <!-- CONTAINER PRINCIPAL / ABAS -->
    <main class="max-w-md mx-auto p-4 mt-2">

        <!-- ABA 1: ENTRADA -->
        <section id="aba-entrada" class="space-y-4">
            <div class="bg-white text-slate-800 p-6 rounded-3xl shadow-xl space-y-4">
                <h2 class="text-blue-600 font-bold text-lg uppercase italic">Nova Entrada</h2>
                
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase">Placa</label>
                    <input type="text" id="input-placa" placeholder="EX: EJD5D22" class="w-full bg-slate-100 p-4 rounded-xl font-bold uppercase text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase">Modelo do Veículo</label>
                    <input type="text" id="input-modelo" placeholder="EX: IVECO DAILY" class="w-full bg-slate-100 p-4 rounded-xl font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase">Nome do Cliente</label>
                    <input type="text" id="input-cliente" placeholder="EX: TRANSPANTANAL" class="w-full bg-slate-100 p-4 rounded-xl font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="flex items-center gap-4 pt-2">
                    <label class="border-2 border-dashed border-blue-300 rounded-2xl p-4 flex flex-col items-center justify-center cursor-pointer hover:bg-blue-50 transition w-1/3">
                        <i class="fa-solid fa-camera text-2xl text-blue-500"></i>
                        <span class="text-[10px] font-bold text-blue-600 mt-1">FOTO</span>
                        <input type="file" id="input-foto" accept="image/*" class="hidden">
                    </label>
                    
                    <button onclick="salvarVeiculo()" class="w-2/3 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-lg transition uppercase tracking-wider">
                        Salvar
                    </button>
                </div>
                <div id="preview-foto-nome" class="text-xs text-slate-400 italic">Nenhuma foto selecionada</div>
            </div>
        </section>

        <!-- ABA 2: PÁTIO -->
        <section id="aba-patio" class="hidden space-y-4">
            <h2 class="text-lg font-bold text-slate-300 px-2">Veículos no Pátio</h2>
            <div id="lista-patio" class="space-y-4">
                <!-- Cards dinâmicos -->
            </div>
        </section>

        <!-- ABA 3: HISTÓRICO -->
        <section id="aba-historico" class="hidden space-y-4">
            <h2 class="text-lg font-bold text-slate-300 px-2">Histórico de Saídas</h2>
            <div id="lista-historico" class="space-y-3">
                <!-- Histórico dinâmico -->
            </div>
        </section>

    </main>

    <!-- MODAL DE EDIÇÃO -->
    <div id="modal-editar" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white text-slate-800 w-full max-w-md p-6 rounded-3xl shadow-2xl space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-blue-600 font-bold text-lg uppercase italic">Editar Ordem</h2>
                <button onclick="fecharModalEditar()" class="text-slate-400 hover:text-slate-700 text-xl font-bold">&times;</button>
            </div>
            
            <input type="hidden" id="edit-id">

            <div>
                <label class="text-xs font-bold text-slate-500 uppercase">Placa</label>
                <input type="text" id="edit-placa" class="w-full bg-slate-100 p-4 rounded-xl font-bold uppercase text-slate-700 focus:outline-none">
            </div>

            <div>
                <label class="text-xs font-bold text-slate-500 uppercase">Modelo do Veículo</label>
                <input type="text" id="edit-modelo" class="w-full bg-slate-100 p-4 rounded-xl font-medium text-slate-700 focus:outline-none">
            </div>

            <div>
                <label class="text-xs font-bold text-slate-500 uppercase">Nome do Cliente</label>
                <input type="text" id="edit-cliente" class="w-full bg-slate-100 p-4 rounded-xl font-medium text-slate-700 focus:outline-none">
            </div>

            <div class="flex gap-3 pt-2">
                <button onclick="fecharModalEditar()" class="w-1/2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 rounded-2xl transition uppercase">Cancelar</button>
                <button onclick="atualizarVeiculo()" class="w-1/2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-2xl shadow transition uppercase">Atualizar</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE SAÍDA / SERVIÇO REALIZADO -->
    <div id="modal-saida" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white text-slate-800 w-full max-w-md p-6 rounded-3xl shadow-2xl space-y-4">
            <h2 class="text-emerald-600 font-bold text-lg uppercase italic">Registrar Saída</h2>
            <p class="text-xs text-slate-500">Informe o que foi realizado no veículo para salvar no histórico:</p>
            
            <input type="hidden" id="saida-id">

            <div>
                <label class="text-xs font-bold text-slate-500 uppercase">Serviço / O que foi feito</label>
                <textarea id="saida-servico" rows="3" placeholder="EX: REVISÃO DE BICOS INJETORES E TROCA DE FILTRO" class="w-full bg-slate-100 p-4 rounded-xl font-medium text-slate-700 focus:outline-none"></textarea>
            </div>

            <div class="flex gap-3 pt-2">
                <button onclick="fecharModalSaida()" class="w-1/2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 rounded-2xl transition uppercase">Cancelar</button>
                <button onclick="confirmarSaida()" class="w-1/2 bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-2xl shadow transition uppercase">Liberar Saída</button>
            </div>
        </div>
    </div>

    <!-- MENU INFERIOR FIXO -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-800 border-t border-slate-700 flex justify-around py-3 shadow-2xl z-40">
        <button onclick="mudarAba('entrada')" id="nav-entrada" class="flex flex-col items-center text-blue-400">
            <i class="fa-solid fa-plus text-lg"></i>
            <span class="text-[10px] font-bold mt-1">ENTRADA</span>
        </button>
        <button onclick="mudarAba('patio')" id="nav-patio" class="flex flex-col items-center text-slate-400">
            <i class="fa-solid fa-car text-lg"></i>
            <span class="text-[10px] font-bold mt-1">PÁTIO</span>
        </button>
        <button onclick="mudarAba('historico')" id="nav-historico" class="flex flex-col items-center text-slate-400">
            <i class="fa-solid fa-clipboard-list text-lg"></i>
            <span class="text-[10px] font-bold mt-1">HISTÓRICO</span>
        </button>
    </nav>

    <!-- SCRIPT DE CONEXÃO E LÓGICA -->
    <script>
        const SUPABASE_URL = 'https://ywybppfkyekqlrndwhdn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_R08_JT0lLER2lnRE-v4xSw_4Dgl8BDU';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let arquivoFoto = null;

        document.getElementById('input-foto').addEventListener('change', (e) => {
            arquivoFoto = e.target.files[0];
            if(arquivoFoto) {
                document.getElementById('preview-foto-nome').innerText = "Foto selecionada: " + arquivoFoto.name;
            }
        });

        function mudarAba(aba) {
            document.getElementById('aba-entrada').classList.add('hidden');
            document.getElementById('aba-patio').classList.add('hidden');
            document.getElementById('aba-historico').classList.add('hidden');

            document.getElementById('nav-entrada').className = "flex flex-col items-center text-slate-400";
            document.getElementById('nav-patio').className = "flex flex-col items-center text-slate-400";
            document.getElementById('nav-historico').className = "flex flex-col items-center text-slate-400";

            document.getElementById(`aba-${aba}`).classList.remove('hidden');
            document.getElementById(`nav-${aba}`).className = "flex flex-col items-center text-blue-400";

            if(aba === 'patio') carregarPatio();
            if(aba === 'historico') carregarHistorico();
        }

        async function salvarVeiculo() {
            const placa = document.getElementById('input-placa').value.toUpperCase();
            const modelo = document.getElementById('input-modelo').value.toUpperCase();
            const cliente = document.getElementById('input-cliente').value.toUpperCase();

            if(!placa || !modelo || !cliente) {
                alert('Preencha todos os campos!');
                return;
            }

            let fotoUrl = '';
            if(arquivoFoto) {
                const nomeArquivo = `${Date.now()}_${arquivoFoto.name}`;
                const { error: uploadError } = await supabaseClient.storage
                    .from('fotos-veiculos')
                    .upload(nomeArquivo, arquivoFoto);

                if(uploadError) {
                    alert('Erro ao enviar foto: ' + uploadError.message);
                    return;
                }

                const { data: publicURL } = supabaseClient.storage
                    .from('fotos-veiculos')
                    .getPublicUrl(nomeArquivo);
                
                fotoUrl = publicURL.publicUrl;
            }

            const { error } = await supabaseClient
                .from('patio_veiculos')
                .insert([{ placa, modelo, cliente, foto_url: fotoUrl, status: 'PATIO' }]);

            if(error) {
                alert('Erro ao salvar: ' + error.message);
            } else {
                alert('Veículo cadastrado com sucesso!');
                document.getElementById('input-placa').value = '';
                document.getElementById('input-modelo').value = '';
                document.getElementById('input-cliente').value = '';
                document.getElementById('input-foto').value = '';
                document.getElementById('preview-foto-nome').innerText = 'Nenhuma foto selecionada';
                arquivoFoto = null;
                mudarAba('patio');
            }
        }

        async function carregarPatio() {
            const { data, error } = await supabaseClient
                .from('patio_veiculos')
                .select('*')
                .eq('status', 'PATIO')
                .order('data_entrada', { ascending: false });

            if(error) {
                console.error(error);
                return;
            }

            document.getElementById('contador-patio').innerText = `${data.length} NO PÁTIO`;
            const container = document.getElementById('lista-patio');
            container.innerHTML = '';

            data.forEach(v => {
                container.innerHTML += `
                    <div class="bg-white text-slate-800 p-4 rounded-3xl shadow-xl flex items-center justify-between gap-3">
                        <img src="${v.foto_url || 'https://via.placeholder.com/150'}" class="w-16 h-16 rounded-2xl object-cover border">
                        <div class="flex-1">
                            <h3 class="font-black italic text-slate-900">${v.placa}</h3>
                            <p class="text-xs text-slate-500 font-bold">${v.modelo}</p>
                            <p class="text-[10px] text-blue-600 font-semibold">${v.cliente}</p>
                        </div>
                        <div class="flex flex-col gap-2">
                            <button onclick="abrirModalEditar('${v.id}', '${v.placa}', '${v.modelo}', '${v.cliente}')" class="bg-blue-100 hover:bg-blue-200 text-blue-600 text-[10px] font-bold px-3 py-2 rounded-xl transition">EDITAR</button>
                            <button onclick="abrirModalSaida('${v.id}')" class="bg-emerald-500 hover:bg-emerald-600 text-white text-[10px] font-bold px-3 py-2 rounded-xl shadow transition">SAÍDA</button>
                        </div>
                    </div>
                `;
            });
        }

        function abrirModalEditar(id, placa, modelo, cliente) {
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-placa').value = placa;
            document.getElementById('edit-modelo').value = modelo;
            document.getElementById('edit-cliente').value = cliente;
            document.getElementById('modal-editar').classList.remove('hidden');
        }

        function fecharModalEditar() {
            document.getElementById('modal-editar').classList.add('hidden');
        }

        async function atualizarVeiculo() {
            const id = document.getElementById('edit-id').value;
            const placa = document.getElementById('edit-placa').value.toUpperCase();
            const modelo = document.getElementById('edit-modelo').value.toUpperCase();
            const cliente = document.getElementById('edit-cliente').value.toUpperCase();

            const { error } = await supabaseClient
                .from('patio_veiculos')
                .update({ placa, modelo, cliente })
                .eq('id', id);

            if(error) {
                alert('Erro ao atualizar: ' + error.message);
            } else {
                fecharModalEditar();
                carregarPatio();
            }
        }

        function abrirModalSaida(id) {
            document.getElementById('saida-id').value = id;
            document.getElementById('saida-servico').value = '';
            document.getElementById('modal-saida').classList.remove('hidden');
        }

        function fecharModalSaida() {
            document.getElementById('modal-saida').classList.add('hidden');
        }

        async function confirmarSaida() {
            const id = document.getElementById('saida-id').value;
            const servico = document.getElementById('saida-servico').value.toUpperCase();

            if(!servico) {
                alert('Informe o que foi feito no veículo antes de liberar a saída.');
                return;
            }

            const { error } = await supabaseClient
                .from('patio_veiculos')
                .update({ 
                    status: 'SAIU', 
                    data_saida: new Date(),
                    servico_realizado: servico 
                })
                .eq('id', id);

            if(error) {
                alert('Erro ao registrar saída: ' + error.message);
            } else {
                fecharModalSaida();
                carregarPatio();
            }
        }

        async function carregarHistorico() {
            const { data, error } = await supabaseClient
                .from('patio_veiculos')
                .select('*')
                .eq('status', 'SAIU')
                .order('data_saida', { ascending: false })
                .limit(20);

            const container = document.getElementById('lista-historico');
            container.innerHTML = '';

            if(data) {
                data.forEach(v => {
                    container.innerHTML += `
                        <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-1 text-sm">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-white">${v.placa}</span>
                                <span class="text-[10px] text-emerald-400 font-bold uppercase">LIBERADO</span>
                            </div>
                            <div class="text-xs text-slate-400 font-medium">${v.modelo} - Cliente: ${v.cliente}</div>
                            <div class="text-xs text-blue-300 bg-slate-900 p-2 rounded-xl mt-1 border border-slate-700">
                                <strong>Serviço:</strong> ${v.servico_realizado || 'Não especificado'}
                            </div>
                        </div>
                    `;
                });
            }
        }

        // Registrar Service Worker para PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        carregarPatio();
    </script>
</body>
</html>
